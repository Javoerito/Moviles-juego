<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ViboLínea</title>
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --mut: #9a9a9a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #000;
                --fg: #fff;
            }
        }

        :root[data-theme="dark"] {
            --bg: #000;
            --fg: #fff;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, .72);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: .08em;
            font-weight: 300;
        }

        p {
            margin: 0;
            color: var(--mut);
            max-width: 34ch;
            line-height: 1.5;
            font-size: .95rem;
        }

        button,
        label.b {
            border: 2px solid var(--fg);
            background: transparent;
            color: var(--fg);
            padding: 12px 22px;
            font: inherit;
            border-radius: 4px;
            cursor: pointer;
            min-width: 220px;
        }

        button:hover,
        label.b:hover {
            background: var(--fg);
            color: var(--bg);
        }

        input {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div id="menu" style="display:none">
        <h1 id="ttl">ViboLínea</h1>
        <p id="msg">Los obstáculos nacen de la música. Cuando uno llegue al círculo de Vibri: bloque (graves) = ↑, aro (agudos) = ↓. Entre más justo, más puntos.</p>
        <button id="demo">Jugar con demo</button>
        <label class="b">Cargar tu canción<input id="file" type="file" accept="audio/*"></label>
        <p>↑ / Espacio / W: arriba · ↓ / S: abajo<br>Móvil: toca la mitad de arriba = ↑, la de abajo = ↓</p>
    </div>

    <script>
        const LEAD = 2.0, cv = document.getElementById('c'), g = cv.getContext('2d');
        // Cámara 3D: yaw + perspectiva. Vibri queda 2D plano, el entorno es 3D.
        const TH = .38, CT = Math.cos(TH), ST = Math.sin(TH), CX = -260, CY = 130, CZ = -520;
        let W, H, k, gy, px, speed, FOC, ox, oy, D, wm = 1, rotA = 0, rotAx = 0, formP = -1;
const NEAR = 120;
        // Rotación del escenario alrededor del origen (donde está Vibri): eje 0=X (a lo largo de la pista), 1=Y, 2=Z
        function rot(X, Y, Z) {
            if (!rotA) return [X, Y, Z];
            const c = Math.cos(rotA), s = Math.sin(rotA);
            if (rotAx === 0) return [X, Y * c - Z * s, Y * s + Z * c];
            if (rotAx === 1) return [X * c + Z * s, Y, -X * s + Z * c];
            return [X * c - Y * s, X * s + Y * c, Z];
        }
        function cam(X, Y, Z) { const r = rot(X, Y, Z), dx = r[0] - CX, dz = r[2] - CZ; return [dx * CT - dz * ST, CY - r[1], dx * ST + dz * CT]; }
        function sc3(c) { const s = FOC / c[2]; return [c[0] * s + ox, c[1] * s + oy]; }
        function proj(X, Y, Z) { return sc3(cam(X, Y, Z)); }
        const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        // Polilínea 3D con recorte contra el plano cercano (para que el giro no rompa las líneas al pasar junto a la cámara)
        function L3(P3, close) {
            const C = (close ? P3.concat([P3[0]]) : P3).map(p => cam(p[0], p[1], p[2]));
            let run = [];
            const flush = () => { if (run.length > 1) poly(run); run = []; };
            for (let i = 0; i < C.length; i++) {
                const a = C[i], ina = a[2] >= NEAR;
                if (i === 0) { if (ina) run.push(sc3(a)); continue; }
                const b = C[i - 1], inb = b[2] >= NEAR;
                if (ina && inb) run.push(sc3(a));
                else if (inb && !ina) { run.push(sc3(lerp3(b, a, (NEAR - b[2]) / (a[2] - b[2])))); flush(); }
                else if (!inb && ina) run = [sc3(lerp3(b, a, (NEAR - b[2]) / (a[2] - b[2]))), sc3(a)];
            }
            flush();
        }
        function rs() {
            const d = devicePixelRatio || 1;
            W = innerWidth;
            H = innerHeight;
            cv.width = W * d;
            cv.height = H * d;
            g.setTransform(d, 0, 0, d, 0, 0);
            k = Math.max(.5, Math.min(1.2, H / 520));
            gy = H * .72;
            px = W * .2;
            const zr0 = -CX * ST - CZ * CT, xr0 = -CX * CT + CZ * ST;
            FOC = k * zr0;
            ox = px - xr0 * k;
            oy = gy - CY * k; // el origen 3D cae donde está Vibri
            for (D = 600; D < 6000; D += 100)
                if (proj(D, 0, 0)[0] > W + 80)
                    break;
            speed = D / LEAD;
        }
        addEventListener('resize', rs);
        rs();
        // ---------- Estado ----------
        let ctx, bus, an, dl, timer, state = 'intro', introT0 = -1, obs = [], score = 0, combo = 0, miss = 0, best = 0, jumpT = -9, duckEnd = -9, msg = '', msgT = -9, flash = -9, songEnd = Infinity, aB = 0, aT = 0, lastB = 0, lastT = 0, step = 0, nextT = 0;
        const fd = new Uint8Array(512);
        const WOBBLE = .7; // sube/baja para más o menos inestabilidad
        let wob = 1.5, tw = 0, pc = 0, lvl = 0;
        // ---------- Audio: bus -> analizador (sin retraso) y bus -> delay -> salida ----------
        async function start(file) {
            // Pantalla de carga: letras vectoriales temblorosas con * a cada lado (dura al menos LOAD_MIN s para que se vea)
            state = 'loading';
            loadT0 = -1;
            loadName = file ? file.name : 'DEMO';
            document.getElementById('menu').style.display = 'none';
            const tStart = performance.now();
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            await ctx.resume();
            bus = ctx.createGain();
            an = ctx.createAnalyser();
            an.fftSize = 1024;
            an.smoothingTimeConstant = 0;
            dl = ctx.createDelay(4);
            dl.delayTime.value = LEAD;
            bus.connect(an);
            bus.connect(dl);
            dl.connect(ctx.destination);
            obs = [];
            score = combo = miss = 0;
            jumpT = -9;
            duckEnd = -9;
            msgT = -9;
            flash = -9;
            spinT0 = -1;
            nextSpin = SPIN_EVERY;
            rotA = 0;
            aB = aT = 0;
            lastB = lastT = 0;
            prev.fill(0);
            hist.b = [];
            hist.t = [];
            songEnd = Infinity;
            step = 0;
            let buf = null;
            if (file) {
                try {
                    buf = await ctx.decodeAudioData(await file.arrayBuffer());
                }
                catch (e) {
                    ctx.close();
                    state = 'menu';
                    document.getElementById('msg').textContent = 'No pude leer ese audio. Prueba con mp3/wav.';
                    document.getElementById('menu').style.display = 'flex';
                    return;
                }
            }
            const wait = LOAD_MIN * 1000 - (performance.now() - tStart);
            if (wait > 0) await new Promise(r => setTimeout(r, wait));
            if (buf) {
                const s = ctx.createBufferSource();
                s.buffer = buf;
                s.connect(bus);
                s.start();
                songEnd = ctx.currentTime + buf.duration + LEAD + .5;
            }
            else {
                nextT = ctx.currentTime + .1;
                timer = setInterval(sched, 50);
            }
            state = 'play';
        }
        function noise() {
            const b = ctx.createBuffer(1, ctx.sampleRate * .06, ctx.sampleRate), d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++)
                d[i] = Math.random() * 2 - 1;
            const s = ctx.createBufferSource();
            s.buffer = b;
            return s;
        }
        function kick(t) {
            const o = ctx.createOscillator(), v = ctx.createGain();
            o.frequency.setValueAtTime(150, t);
            o.frequency.exponentialRampToValueAtTime(45, t + .12);
            v.gain.setValueAtTime(1, t);
            v.gain.exponentialRampToValueAtTime(.001, t + .25);
            o.connect(v);
            v.connect(bus);
            o.start(t);
            o.stop(t + .3);
        }
        function hat(t) {
            const s = noise(), f = ctx.createBiquadFilter(), v = ctx.createGain();
            f.type = 'highpass';
            f.frequency.value = 5000;
            v.gain.setValueAtTime(.7, t);
            v.gain.exponentialRampToValueAtTime(.001, t + .06);
            s.connect(f);
            f.connect(v);
            v.connect(bus);
            s.start(t);
        }
        function sched() {
            while (nextT < ctx.currentTime + .5) {
                const s = step % 16;
                if ([0, 3, 6, 8, 11, 12].includes(s))
                    kick(nextT);
                if ([2, 5, 7, 10, 13, 15].includes(s))
                    hat(nextT);
                nextT += .2;
                step++;
            }
        }
        // ---------- Detección de beats (energía por banda) ----------
        function avg(a, b) { let s = 0; for (let i = a; i < b; i++)
            s += fd[i]; return s / (b - a); }
        function spawn(type, now) { const tm = now + LEAD; if (obs.length && tm - obs[obs.length - 1].tm < .3)
            return; obs.push({ type, tm, ok: false, done: false }); }
        // Spectral flux: cuánto SUBI el espectro respecto al frame anterior (detecta ataques, no volumen)
        const prev = new Float32Array(512), hist = { b: [], t: [] };
        function flux(a, b) { let s = 0; for (let i = a; i < b; i++) {
            const d = fd[i] - prev[i];
            if (d > 0)
                s += d;
        } return s / (b - a); }
        // umbral adaptativo: promedio + 1.5 desviaciones de los últimos ~0.7 s (43 frames)
        function onset(h, v, min) {
            h.push(v);
            if (h.length > 43)
                h.shift();
            const m = h.reduce((x, y) => x + y, 0) / h.length, sd = Math.sqrt(h.reduce((x, y) => x + (y - m) ** 2, 0) / h.length);
            return v > m + 1.5 * sd + min;
        }
        function detect(now) {
            an.getByteFrequencyData(fd);
            const b = avg(1, 5), fb = flux(1, 5), ft = flux(100, 250), ob = onset(hist.b, fb, 6), ot = onset(hist.t, ft, 4);
            if (ob && now - lastB > .25) {
                spawn('block', now);
                lastB = now;
            }
            else if (ot && now - lastT > .25) {
                spawn('loop', now);
                lastT = now;
            }
            prev.set(fd);
            lvl = Math.max(lvl, b / 255);
        }
        // ---------- Lógica ----------
        function jumpH(now) { const s = (now - jumpT) / .42; return s > 0 && s < 1 ? 90 * k * 4 * s * (1 - s) : 0; }
        // Modo ritmo: se juzga CUÁNDO presionas. Bloque = ↑, aro = ↓. Si no hay obstáculo cerca, el toque se ignora.
        const WIN = .18, ANIM = true; // WIN: ventana de acierto (s). ANIM=false quita la animación de Vibri al acertar
        function say(t, now) { msg = t; msgT = now; }
        function press(key) {
            if (state !== 'play')
                return;
            const now = ctx.currentTime;
            let o = null, bd = 9;
            for (const x of obs) {
                if (x.done)
                    continue;
                const d = Math.abs(x.tm - now);
                if (d < WIN && d < bd) {
                    o = x;
                    bd = d;
                }
            }
            if (!o)
                return;
            o.done = true;
            if ((key === 'up') === (o.type === 'block')) {
                o.ok = true;
                combo++;
                const pf = bd < .06;
                score += (pf ? 30 : 15) + Math.min(combo, 20) * 2;
                say(pf ? 'PERFECT' : 'BIEN', now);
                if (combo % 30 === 0 && miss > 0) { miss--; say('+1 VIDA', now); } // cada 30 de combo recupera una vida
                if (ANIM) {
                    if (key === 'up')
                        jumpT = now;
                    else
                        duckEnd = now + .4;
                }
            }
            else {
                o.ok = false;
                miss++;
                combo = 0;
                flash = now;
                say('TECLA MALA', now);
            }
        }
        function update(now) {
            for (const o of obs) {
                if (o.done)
                    continue;
                const d = o.tm - now;
                if (d < -WIN) {
                    o.done = true;
                    miss++;
                    combo = 0;
                    flash = now;
                    say('FALLO', now);
                }
            }
            obs = obs.filter(o => o.tm > now - .6);
            if (miss >= 3 || now > songEnd)
                end(now > songEnd && miss < 3);
        }
        function end(won) {
            state = 'menu';
            clearInterval(timer);
            if (ctx)
                ctx.close();
            best = Math.max(best, score);
            document.getElementById('ttl').textContent = won ? '¡Canción completada!' : 'Game over';
            document.getElementById('msg').textContent = 'Puntaje: ' + score + ' · Mejor: ' + best;
            document.getElementById('menu').style.display = 'flex';
        }
        // ---------- Dibujo vectorial: todo son polilíneas ----------
        // Línea inestable: se subdivide cada segmento y cada punto tiembla ("boil" a ~14 fps)
        const rnd = a => { const x = Math.sin(a) * 43758.5453; return x - Math.floor(x) - .5; };
        function poly(pts, close) {
            const P = close ? pts.concat([pts[0]]) : pts, s = Math.floor(tw * 14), o = (pc++) * 7.3, A = wob * k * wm;
            const idx = pc - 1, loc = formP < 0 ? 1 : Math.max(0, Math.min(1, formP * 1.7 - idx / 16 * .7));
            if (loc <= 0) return;
            const fa = formP < 0 ? 0 : (1 - loc * loc * (3 - 2 * loc)) * 90 * k, ga = g.globalAlpha;
            if (formP >= 0) g.globalAlpha = ga * loc;
            let j = 0;
            g.beginPath();
            const pt = (x, y) => { const q = j++ * 12.9 + s * 78.2 + o, X = x + rnd(q) * 2 * A + rnd(j * 29.3 + idx * 7.7) * fa, Y = y + rnd(q + 5.3) * 2 * A + rnd(j * 17.1 + idx * 5.3 + 3.3) * fa; j === 1 ? g.moveTo(X, Y) : g.lineTo(X, Y); };
            for (let i = 0; i < P.length; i++) {
                const [x1, y1] = P[i];
                if (i) {
                    const [x0, y0] = P[i - 1], n = Math.min(80, Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 12)));
                    for (let m = 1; m <= n; m++) {
                        const t = m / n;
                        pt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
                    }
                }
                else
                    pt(x1, y1);
            }
            g.stroke();
            g.globalAlpha = ga;
        }
        const EAR_UP = [[-10, -80], [-16, -100], [-6, -100], [-3, -80]];
        const ell = (x, y, rx, ry, n = 12) => { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); } return p; };
        // Corona dorada (combo >= 30)
        function corona(P, cx, by, w, h) {
            const ss = g.strokeStyle;
            g.strokeStyle = '#fd5';
            poly(P([[cx - w, by], [cx - w, by - h * .6], [cx - w / 2, by - h * .3], [cx, by - h], [cx + w / 2, by - h * .3], [cx + w, by - h * .6], [cx + w, by]]), true);
            g.strokeStyle = ss;
        }
        // Vibri: 3 formas según las vidas -> 3 = conejo, 2 = sapo, 1 = oruga cabezona. Siempre plano (2D).
        // o = opciones (la intro lo usa para dibujarlo en otra posición/escala): x, y, k, jh, sy, still, wave, lives, crown
        function vibri(now, o = {}) {
            const cx = o.x ?? px, cy = o.y ?? gy, K = o.k ?? k, jh = o.jh ?? jumpH(now), air = jh > 0,
                dk = o.dk ?? now < duckEnd, still = !!o.still,
                lives = o.lives ?? (state === 'play' ? Math.max(1, 3 - miss) : 3),
                crown = o.crown ?? (state === 'play' && combo >= 30), wave = o.wave || 0;
            const move = !still && !air && !dk; // anda (no si está quieto, saltando por tecla o agachado)
            // ---- Marcha propia de cada forma (a pocos cuadros porque `now` llega cuantizado) ----
            let lift = 0, sq = 1, hopAir = false;
            const hr = Math.abs(Math.sin(now * 9.4)), ph = (now * 1.9) % 1;
            if (move && lives >= 3) { // conejo: saltitos rápidos
                lift = hr * 14 * K; hopAir = hr > .35; sq = hr < .12 ? .92 : 1;
            } else if (move && lives === 2) { // sapo: se agacha, salta pequeño y aplasta al caer
                if (ph < .3) sq = 1 - .22 * (ph / .3);
                else if (ph < .85) { lift = Math.sin((ph - .3) / .55 * Math.PI) * 24 * K; hopAir = true; sq = 1.06; }
                else sq = .78 + .22 * ((ph - .85) / .15);
            }
            const sy = (o.sy ?? (dk ? .55 : 1)) * sq;
            const P = a => a.map(([u, v]) => [cx + u * K, cy - jh - lift + v * sy * K]);
            if (lives >= 3) { // ---- CONEJO ----
                const v = move ? Math.cos(now * 9.4) * Math.sign(Math.sin(now * 9.4)) : 0, flop = Math.abs(v) * 3; // las orejas se "arrastran" al saltar
                const eL = EAR_UP.map(([x, y], i) => (i === 1 || i === 2) ? [x - flop, y + v * 6] : [x, y]);
                const eR = EAR_UP.map(([x, y], i) => (i === 1 || i === 2) ? [-x - flop, y + v * 6] : [-x, y]);
                poly(P([[-14, -80], [14, -80], [14, -55], [-14, -55]]), true); // cabeza
                poly(P([[-6, -70], [-6, -66]]));
                poly(P([[6, -70], [6, -66]])); // ojos
                poly(P(eL));
                poly(P(eR)); // orejas
                poly(P([[0, -55], [0, -25]])); // cuerpo
                const a = air ? -12 : hopAir ? -8 : (still ? 0 : 3);
                if (wave) { // saludando: el brazo derecho sube y se mueve
                    poly(P([[-14, -36 + a], [0, -48]]));
                    poly(P([[0, -48], [17, -60], [20 + Math.sin(wave) * 8, -78]]));
                } else poly(P([[-14, -36 + a], [0, -48], [14, -36 - a]]));
                const f1 = air ? [-9, -10] : hopAir ? [-10, -8] : [3, 0], f2 = air ? [9, -4] : hopAir ? [10, -3] : [-3, 0];
                poly(P([[0, -25], [f1[0] * .5 + 4, -13], f1]));
                poly(P([[0, -25], [f2[0] * .5 + 4, -13], f2]));

            } else if (lives === 2) { // ---- SAPO ----
                poly(P(ell(0, -24, 26, 17, 14)), true); // cuerpo/cabeza ancho
                poly(P(ell(-13, -44, 7, 7, 8)), true);
                poly(P(ell(13, -44, 7, 7, 8)), true); // ojos saltones
                poly(P([[-13, -45], [-13, -42]]));
                poly(P([[13, -45], [13, -42]])); // pupilas
                poly(P([[-16, -27], [-6, -22], [6, -22], [16, -27]])); // boca ancha
                if (air || hopAir) { // patas estiradas en el salto
                    poly(P([[-14, -16], [-30, -8], [-44, -2]]));
                    poly(P([[14, -14], [28, -20], [36, -16]]));
                } else { // patas dobladas (más dobladas justo antes de saltar)
                    const cr = move && ph < .3 ? ph / .3 : 0;
                    poly(P([[-14, -14], [-28 - cr * 4, -8 + cr * 2], [-16, 0]]));
                    poly(P([[10, -12], [20 + cr * 3, -6 + cr * 2], [26, 0]]));
                }
                if (crown) corona(P, 0, -52, 8, 12);
            } else { // ---- ORUGA CABEZONA: repta como un gusano medidor ----
                const w = move ? now * 5 : 0; // fase del arrastre; la ola de contracción va de la cola hacia la cabeza
                let sx = -8;
                for (let i = 0; i < 4; i++) {
                    const c = move ? .5 + .5 * Math.sin(w + i * 1.15) : .5, r = 10 - i * 1.6,
                        sY = -11 - (air ? Math.sin(i / 3 * Math.PI) * 10 : c * 8); // contraído = arqueado hacia arriba
                    poly(P(ell(sx, sY, r, r, 10)), true);
                    if (!air && c < .55) poly(P([[sx, sY + r], [sx - 2, 0]])); // patitas apoyadas solo cuando está estirado
                    sx -= 17 - 7 * c; // al contraerse los segmentos se juntan
                }
                const hx = move ? Math.sin(w) * 2 : 0, hy = move ? -Math.max(0, Math.sin(w)) * 2 : 0, aw = move ? Math.sin(now * 9) * 3 : 0;
                const HP = a => P(a.map(([u, v]) => [u + hx, v + hy]));
                poly(HP(ell(16, -28, 22, 20, 14)), true); // cabeza enorme
                poly(HP([[8, -34], [8, -30]]));
                poly(HP([[24, -34], [24, -30]])); // ojos
                poly(HP([[6, -20], [16, -14], [26, -20]])); // sonrisa
                poly(HP([[4, -45], [-2 + aw, -62]]));
                poly(HP(ell(-3 + aw, -64, 2.5, 2.5, 6)), true); // antena 1
                poly(HP([[28, -45], [34 + aw, -62]]));
                poly(HP(ell(35 + aw, -64, 2.5, 2.5, 6)), true); // antena 2
                if (!air) {
                    poly(P([[10, -9], [8, 0]]));
                    poly(P([[22, -9], [24, 0]]));
                }
                if (crown) corona(HP, 16, -47, 8, 12);
            }
        }
const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];

            G: [[[4, 1], [3, 0], [1, 0], [0, 1], [0, 5], [1, 6], [3, 6], [4, 5], [4, 3], [2, 3]]],
            H: [[[0, 0], [0, 6]], [[4, 0], [4, 6]], [[0, 3], [4, 3]]],
            I: [[[1, 0], [3, 0]], [[2, 0], [2, 6]], [[1, 6], [3, 6]]],
            J: [[[4, 0], [4, 5], [3, 6], [1, 6], [0, 5]]],
            K: [[[0, 0], [0, 6]], [[4, 0], [0, 3], [4, 6]]],
            L: [[[0, 0], [0, 6], [4, 6]]],
            M: [[[0, 6], [0, 0], [2, 3], [4, 0], [4, 6]]],
            N: [[[0, 6], [0, 0], [4, 6], [4, 0]]],
            O: [OBOX],
            P: [PBOX],
            Q: [OBOX, [[2, 4], [4, 6]]],
            R: [PBOX, [[2, 3], [4, 6]]],
            S: [[[4, 1], [3, 0], [1, 0], [0, 1], [0, 2], [1, 3], [3, 3], [4, 4], [4, 5], [3, 6], [1, 6], [0, 5]]],
            T: [[[0, 0], [4, 0]], [[2, 0], [2, 6]]],
            U: [[[0, 0], [0, 5], [1, 6], [3, 6], [4, 5], [4, 0]]],
            V: [[[0, 0], [2, 6], [4, 0]]],
            W: [[[0, 0], [1, 6], [2, 3], [3, 6], [4, 0]]],
            X: [[[0, 0], [4, 6]], [[4, 0], [0, 6]]],
            Y: [[[0, 0], [2, 3], [4, 0]], [[2, 3], [2, 6]]],
            Z: [[[0, 0], [4, 0], [0, 6], [4, 6]]],
            Ó: [OBOX, [[2, -1], [3.2, -2.2]]],
            Ñ: [[[0, 6], [0, 0], [4, 6], [4, 0]], [[.8, -1.2], [1.6, -2.2], [2.4, -1.2], [3.2, -2.2]]],
            0: [OBOX],
            1: [[[1, 1], [2, 0], [2, 6]], [[1, 6], [3, 6]]],
            2: [[[0, 1], [1, 0], [3, 0], [4, 1], [4, 2], [0, 6], [4, 6]]],
            3: [[[0, 0], [4, 0], [2, 2], [4, 3], [4, 5], [3, 6], [1, 6], [0, 5]]],
            4: [[[3, 6], [3, 0], [0, 4], [4, 4]]],
            5: [[[4, 0], [0, 0], [0, 3], [3, 3], [4, 4], [4, 5], [3, 6], [0, 6]]],
            6: [[[4, 0], [1, 0], [0, 1], [0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [3, 3], [0, 3]]],
            7: [[[0, 0], [4, 0], [1, 6]]],
            8: [[[1, 3], [0, 2], [0, 1], [1, 0], [3, 0], [4, 1], [4, 2], [3, 3], [1, 3], [0, 4], [0, 5], [1, 6], [3, 6], [4, 5], [4, 4], [3, 3]]],
            9: [[[0, 6], [3, 6], [4, 5], [4, 1], [3, 0], [1, 0], [0, 1], [0, 2], [1, 3], [4, 3]]],
            '.': [[[1.7, 5.5], [2.3, 5.5], [2.3, 6], [1.7, 6], [1.7, 5.5]]],
            '-': [[[1, 3], [3, 3]]],
            '_': [[[0, 6.6], [4, 6.6]]],
            '!': [[[2, 0], [2, 4]], [[2, 5.4], [2, 6]]]
        };
        // Escribe texto con la fuente vectorial, centrado en (cx, cy); `size` = píxeles por unidad de la cuadrícula (letra = 4x6)
        function vtext(str, cx, cy, size) {
            const adv = 6 * size, x0 = cx - (str.length * 6 - 2) * size / 2;
            for (let i = 0; i < str.length; i++) {
                let ch = str[i].toUpperCase();
                if (!FONT[ch]) ch = ch.normalize('NFD')[0];
                const gl = FONT[ch];
                if (!gl) continue;
                for (const st of gl) poly(st.map(([u, v]) => [x0 + i * adv + u * size, cy + (v - 3) * size]));
            }
        }
        // Asterisco vectorial (3 rayas cruzadas) que gira y late
        function asterisk(cx, cy, r, now) {
            const rot = now * 2.4, rr = r * (.85 + .15 * Math.sin(now * 7));
            for (let a = 0; a < 3; a++) {
                const an2 = rot + a * Math.PI / 3, dx = Math.cos(an2) * rr, dy = Math.sin(an2) * rr;
                poly([[cx - dx, cy - dy], [cx + dx, cy + dy]]);
            }
        }
        function drawLoading(t, now) {
            g.fillStyle = '#000';
            g.fillRect(0, 0, W, H);
            g.lineWidth = 3;
            g.lineJoin = 'round';
            g.lineCap = 'round';
            const isDemo = loadName === 'DEMO', title = isDemo ? 'CARGANDO DEMO' : 'CARGANDO CANCIÓN';
            const size = Math.min(8 * k, W * .8 / (title.length * 6 + 18)), cy = H * .45;
            wm = 2.2; // letras más temblorosas que el resto del juego
            g.globalAlpha = Math.min(1, t / .3);
            g.strokeStyle = '#fff';
            vtext(title, W / 2, cy, size);
            const half = (title.length * 6 - 2) * size / 2 + size * 5, rr = size * 3.2; // * a cada lado
            asterisk(W / 2 - half, cy, rr, now);
            asterisk(W / 2 + half, cy, rr, -now);
            let by = cy + size * 10;
            if (!isDemo) { // nombre del archivo (sin extensión, recortado)
                let nm = loadName.replace(/\.[^.]+$/, '').toUpperCase();
                if (nm.length > 26) nm = nm.slice(0, 25) + '...';
                g.strokeStyle = '#9a9a9a';
                vtext(nm, W / 2, cy + size * 8, size * .5);
                by = cy + size * 13;
            }
            // barra con un bloque que va y viene
            const bw = Math.min(W * .5, 320 * k), bx0 = W / 2 - bw / 2, bh = size * 2.2, u = (now * .9) % 1, p = 1 - Math.abs(2 * u - 1), blk = bw * .22;
            g.strokeStyle = '#fff';
            poly([[bx0, by], [bx0 + bw, by], [bx0 + bw, by + bh], [bx0, by + bh]], true);
            const fx = bx0 + 5 + p * (bw - 10 - blk);
            for (let xx = fx; xx <= fx + blk; xx += 6) poly([[xx, by + 4], [xx, by + bh - 4]]);
            wm = 1;
            g.globalAlpha = 1;
        }
                // ---------- Giro lento del escenario cada 3000 puntos (eje al azar: X, Y o Z) ----------
        const SPIN_EVERY = 3000, SPIN_DUR = 9;
        let spinT0 = -1, nextSpin = SPIN_EVERY;
        function spinStep(now) {
            if (spinT0 < 0 && score >= nextSpin) {
                spinT0 = now;
                rotAx = Math.floor(Math.random() * 3);
                nextSpin += SPIN_EVERY;
                say('¡GIRO!', now);
            }
            if (spinT0 >= 0) {
                const p = (now - spinT0) / SPIN_DUR;
                if (p >= 1) { spinT0 = -1; rotA = 0; }
                else rotA = Math.PI * 2 * p * p * (3 - 2 * p); // 360° con arranque y frenado suaves
            }
        }
        // El juego (obstáculos, escenario, cámara) va fluido. Solo van a FPS cuadros: la intro, el menú y las animaciones de Vibri (saltar, agacharse, correr)
        function frame() {
            requestAnimationFrame(frame);
            const now = state === 'play' ? ctx.currentTime : performance.now() / 1000;
            const qn = Math.floor(now * FPS) / FPS, newF = qn !== lastQ;
            lvl *= .94;
            wob = (1.2 + lvl * 3 + (now - flash < .3 ? 4 : 0)) * WOBBLE; // más temblor con los graves y al fallar
            if (state === 'loading') {
                if (loadT0 < 0) loadT0 = now;
                if (newF) { lastQ = qn; tw = qn; pc = 0; drawLoading(Math.max(0, qn - loadT0), qn); }
                return;
            }
            if (state === 'intro') {
                if (introT0 < 0) {
                    if (ramFail) introT0 = now - T_ZOOM; // sin imagen: se salta el zoom
                    else if (ramImg.complete) introT0 = now;
                    else { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
                }
                if (now - introT0 >= T_END) { endIntro(); return; }
                if (newF) { lastQ = qn; tw = qn; pc = 0; drawIntro(Math.max(0, qn - introT0), qn); }
                return;
            }
            if (state === 'play') { // partida: dibujo a máxima fluidez
                detect(now);
                update(now);
                spinStep(now);
                tw = now;
                pc = 0;
                draw(now);
                drawMsg(now);
                return;
            }
            rotA = 0; // en el menú el escenario queda recto, a pocos cuadros
            if (newF) { lastQ = qn; tw = qn; pc = 0; draw(qn); drawMsg(qn); }
        }
        requestAnimationFrame(frame);
        // ---------- Controles ----------
        addEventListener('keydown', e => {
            if (state === 'intro') { endIntro(); return; }
            if (['ArrowUp', 'Space', 'KeyW'].includes(e.code)) {
                e.preventDefault();
                if (!e.repeat)
                    press('up');
            }
            if (['ArrowDown', 'KeyS'].includes(e.code)) {
                e.preventDefault();
                if (!e.repeat)
                    press('down');
            }
        });
        cv.addEventListener('pointerdown', e => { if (state === 'intro') return endIntro(); press(e.clientY < H / 2 ? 'up' : 'down'); });
        document.getElementById('demo').onclick = () => start();
        document.getElementById('file').onchange = e => { if (e.target.files[0])
            start(e.target.files[0]); };
    </script>
